name: preview-tunnel

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'How long to keep the preview alive (minutes, max ~340)'
        required: false
        default: '180'
      port:
        description: 'Local port for the PHP web server'
        required: false
        default: '8000'
      php_version:
        description: 'PHP version to use'
        required: false
        default: '8.2'
      admin_password:
        description: 'Admin panel password for the preview (empty = auto-generated, shown in summary)'
        required: false
        default: ''
      public_hostname:
        description: 'Public hostname served by the named tunnel (requires CF_TUNNEL_TOKEN secret)'
        required: false
        default: 'snap00.mrme.tech'

# A single preview per branch/run; canceling is done manually via "Cancel workflow".
concurrency:
  group: preview-tunnel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    # GitHub Jobs hard-limit is 6h (360 min). 350 gives headroom for setup/teardown
    # while guaranteeing the requested minimum of 3h (180 min).
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version || '8.2' }}
          extensions: mbstring, intl, gd, zip, pdo_sqlite, sqlite3, curl, dom, openssl, json, iconv, ldap, imagick, gnupg, uuid
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Build frontend assets
        run: |
          set -eux
          yarn install --frozen-lockfile
          npx gulp build
          ls snappymail/v/0.0.0/static/css/ snappymail/v/0.0.0/static/js/

      - name: Prepare data directory
        run: |
          mkdir -p data/_data_/_default_
          chmod -R 777 data
          php -v
          ls snappymail/v/

      - name: Set admin password
        run: |
          set -eu
          if [ -z "${ADMIN_PASS:-}" ]; then
            echo "No admin_password input — SnappyMail will auto-generate one (see 'Show admin credentials' step)."
            exit 0
          fi
          echo "::add-mask::$ADMIN_PASS"
          SNAPPYMAIL_INCLUDE_AS_API=1 php -r '
            $_ENV["SNAPPYMAIL_INCLUDE_AS_API"] = true;
            require "index.php";
            $pass = getenv("ADMIN_PASS");
            if (!$pass) { fwrite(STDERR, "Empty admin password\n"); exit(1); }
            $oConfig = \RainLoop\Api::Config();
            $oConfig->SetPassword(new \SnappyMail\SensitiveString($pass));
            if (!$oConfig->Save()) { fwrite(STDERR, "Failed to save config\n"); exit(1); }
            $passfile = APP_PRIVATE_DATA . "admin_password.txt";
            if (is_file($passfile)) { unlink($passfile); }
            echo "Admin password preset\n";
          '
          grep -q 'admin_password' data/_data_/_default_/configs/application.ini && echo "admin_password hash present"
        env:
          ADMIN_PASS: ${{ inputs.admin_password }}

      - name: Install cloudflared
        run: |
          set -eux
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update && sudo apt-get install -y cloudflared
          cloudflared --version

      - name: Start SnappyMail (PHP built-in server)
        run: |
          set -eux
          PORT="${{ inputs.port || '8000' }}"
          echo "PORT=$PORT" >> "$GITHUB_ENV"
          # Serve repo root (index.php lives there)
          nohup php -S "0.0.0.0:$PORT" -t . > /tmp/php-server.log 2>&1 &
          echo $! > /tmp/php-server.pid
          # Wait for a response (index.php returns body text even on error, still HTTP 200)
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/" > /dev/null; then
              echo "Web server is up on port $PORT"
              break
            fi
            echo "Waiting for PHP server... ($i/30)"
            sleep 2
            if [ "$i" = "30" ]; then
              echo "PHP server failed to start:"
              cat /tmp/php-server.log
              exit 1
            fi
          done
          curl -s -o /dev/null -w "local HTTP status: %{http_code}\n" "http://127.0.0.1:$PORT/"

      - name: Start Cloudflare Tunnel (fail fast)
        id: tunnel
        run: |
          set -eux
          : "${PORT:?PORT env must be set by previous step}"
          rm -f /tmp/cloudflared.log /tmp/cloudflared.pid /tmp/public-url.txt

          if [ -n "${CF_TUNNEL_TOKEN:-}" ]; then
            echo "Using authenticated (named) tunnel from CF_TUNNEL_TOKEN secret"
            # NOTE: `cloudflared service install` is for persistent VMs with
            # systemd only — GitHub runners are ephemeral with no systemd, so
            # the equivalent here is `cloudflared tunnel run --token`.
            # The tunnel's public hostname (e.g. snap00.mrme.tech) must already
            # be routed to this tunnel in the Cloudflare dashboard
            # (tunnel's Public Hostname -> http://127.0.0.1:PORT).
            nohup cloudflared tunnel --no-autoupdate run --token "$CF_TUNNEL_TOKEN" > /tmp/cloudflared.log 2>&1 &
            echo $! > /tmp/cloudflared.pid
            sleep 15
            # Named tunnel hostnames are user-configured; record the expected one.
            echo "https://${PUBLIC_HOSTNAME}" > /tmp/public-url.txt
            echo "url=https://${PUBLIC_HOSTNAME}" >> "$GITHUB_OUTPUT"
          else
            echo "Using ephemeral Quick Tunnel (no token needed)"
            # Attempt 1: default transport (QUIC). Attempt 2: http2 fallback,
            # because UDP/QUIC is commonly blocked on hosted runners.
            for PROTO in quic http2; do
              echo "--- attempt with --protocol $PROTO ---"
              rm -f /tmp/cloudflared.log
              if [ -f /tmp/cloudflared.pid ] && kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
                kill "$(cat /tmp/cloudflared.pid)" || true
                sleep 3
              fi
              # shellcheck disable=SC2086
              nohup cloudflared tunnel --no-autoupdate --protocol $PROTO --url "http://127.0.0.1:${PORT}" > /tmp/cloudflared.log 2>&1 &
              echo $! > /tmp/cloudflared.pid
              for i in $(seq 1 45); do
                sleep 2
                URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
                if [ -n "${URL:-}" ]; then
                  echo "$URL" > /tmp/public-url.txt
                  echo "url=$URL" >> "$GITHUB_OUTPUT"
                  echo "Tunnel established via $PROTO: $URL"
                  break 2
                fi
                # Abort this attempt early if the daemon already died
                if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
                  echo "cloudflared ($PROTO) exited early, log:"
                  cat /tmp/cloudflared.log
                  break
                fi
              done
              echo "No URL after ~90s on $PROTO, trying next transport..."
            done
            if [ ! -s /tmp/public-url.txt ]; then
              echo "ERROR: cloudflared never printed a trycloudflare.com URL."
              echo "===== cloudflared.log ====="
              cat /tmp/cloudflared.log
              exit 1
            fi
          fi

          URL="$(cat /tmp/public-url.txt)"
          {
            echo "## SnappyMail preview"
            echo ""
            echo "- Local: http://127.0.0.1:${PORT}/ (runner-internal only)"
            if [ "$URL" = "NAMED_TUNNEL" ]; then
              echo "- Public: your named-tunnel hostname (from CF_TUNNEL_TOKEN setup)"
            else
              echo "- Public: $URL"
              echo "- Admin panel: ${URL}/?admin"
            fi
            echo "- To stop early: open the workflow run and click **Cancel workflow**."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=SnappyMail preview::$URL"
        env:
          # Optional: create a repository secret named CF_TUNNEL_TOKEN with a
          # `cloudflared tunnel token <NAME>` value to use a stable named tunnel
          # instead of an ephemeral *.trycloudflare.com URL.
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          PUBLIC_HOSTNAME: ${{ inputs.public_hostname || 'snap00.mrme.tech' }}

      - name: Publish tunnel info artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-info
          path: |
            /tmp/public-url.txt
            /tmp/cloudflared.log
            /tmp/php-server.log
            data/_data_/_default_/admin_password.txt
          if-no-files-found: warn

      - name: Verify public URL end-to-end
        if: steps.tunnel.outputs.url != ''
        run: |
          set -eux
          URL="${{ steps.tunnel.outputs.url }}"
          echo "Probing $URL from the runner (egress -> Cloudflare edge -> back)..."
          for i in $(seq 1 12); do
            CODE="$(curl -s -o /tmp/home.html -w '%{http_code}' -L --max-time 20 "$URL/" || echo '000')"
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ] && grep -q 'snappymail/v/' /tmp/home.html; then
              # Static assets are gitignored and built by `gulp build`;
              # a 200 on / alone is not enough (index.php returns 200 even when broken).
              CSS="$(grep -Eo '/snappymail/v/[^"]+\.css' /tmp/home.html | head -n1)"
              echo "Checking static asset: $CSS"
              ASSET_CODE="$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "${URL}${CSS}" || echo '000')"
              echo "asset HTTP $ASSET_CODE"
              if [ "$ASSET_CODE" = "200" ]; then
                echo "End-to-end check PASSED"
                grep -Eo '<title>[^<]*' /tmp/home.html | head -n1 || true
                exit 0
              fi
              echo "index.html OK but static asset missing — frontend build incomplete"
            fi
            sleep 10
          done
          echo "End-to-end check FAILED — cloudflared log tail:"
          tail -n 80 /tmp/cloudflared.log
          exit 1

      - name: Show admin credentials
        run: |
          set -eu
          if [ -n "${ADMIN_PASS_PRESET:-}" ]; then
            {
              echo "## Admin credentials (ephemeral preview only)"
              echo ""
              echo "- Login: \`admin\`"
              echo "- Password: the \`admin_password\` workflow input value"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Random flow: first ?admin hit creates
          # data/_data_/_default_/admin_password.txt — trigger it, then publish.
          PASSFILE="data/_data_/_default_/admin_password.txt"
          for i in $(seq 1 6); do
            [ -s "$PASSFILE" ] && break
            curl -s -o /dev/null -L --max-time 20 "http://127.0.0.1:${PORT}/?admin" || true
            sleep 5
          done
          {
            echo "## Admin credentials (ephemeral preview only)"
            echo ""
            echo "- Login: \`admin\`"
            if [ -s "$PASSFILE" ]; then
              echo "- Password: \`$(cat "$PASSFILE")\`"
            else
              echo "- Password: login as \`admin\` with empty password, then set one"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$PASSFILE" ]; then
            echo "::notice title=SnappyMail admin password::$(cat "$PASSFILE")"
          fi
        env:
          ADMIN_PASS_PRESET: ${{ inputs.admin_password }}

      - name: Keep alive
        run: |
          set -eux
          DURATION_MINUTES="${{ inputs.duration_minutes || '180' }}"
          # Clamp to 10..340 so timeout-minutes: 350 is never exceeded
          if [ "$DURATION_MINUTES" -gt 340 ]; then DURATION_MINUTES=340; fi
          if [ "$DURATION_MINUTES" -lt 10 ]; then DURATION_MINUTES=10; fi
          END_EPOCH=$(( $(date +%s) + DURATION_MINUTES * 60 ))
          echo "Keeping preview alive for ${DURATION_MINUTES} minutes (until $(date -u -d "@$END_EPOCH" '+%Y-%m-%d %H:%M:%S UTC'))"
          URL="$(cat /tmp/public-url.txt 2>/dev/null || echo pending)"
          while [ "$(date +%s)" -lt "$END_EPOCH" ]; do
            REMAIN=$(( (END_EPOCH - $(date +%s)) / 60 ))
            STATUS="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/" || echo 'down')"
            echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] alive, ~${REMAIN} min left, local HTTP=${STATUS}, public=${URL} | 'Cancel workflow' to stop"
            if ! kill -0 "$(cat /tmp/php-server.pid)" 2>/dev/null; then
              echo "PHP server died:"; cat /tmp/php-server.log; exit 1
            fi
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo "cloudflared died:"; cat /tmp/cloudflared.log; exit 1
            fi
            # Sleep in small chunks so Cancel responds fast; total ~5 min per iteration
            for _ in $(seq 1 30); do
              [ "$(date +%s)" -ge "$END_EPOCH" ] && break 2
              sleep 10
            done
          done
          echo "Requested duration elapsed — shutting down tunnel and web server."
          kill "$(cat /tmp/cloudflared.pid)" || true
          kill "$(cat /tmp/php-server.pid)" || true

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "===== cloudflared.log ====="
          cat /tmp/cloudflared.log || true
          echo "===== php-server.log ====="
          cat /tmp/php-server.log || true
